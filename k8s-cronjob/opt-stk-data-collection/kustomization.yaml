apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for the deployment
namespace: default

# Common labels applied to all resources
commonLabels:
  app: opt-stk-data-collection
  version: v1.0.0
  environment: production

# Resources to include
resources:
  - configmap.yaml
  - secret.yaml
  - cronjob.yaml

# Images to customize (for different environments)
images:
  - name: registry.cgraaaj.in/stock-x/opt-stk-data-collection
    newTag: latest

