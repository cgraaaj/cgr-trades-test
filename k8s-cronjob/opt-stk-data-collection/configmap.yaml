apiVersion: v1
kind: ConfigMap
metadata:
  name: opt-stk-config
  labels:
    app: opt-stk-data-collection
    component: data-ingestion
data:
  # Database configuration (non-sensitive)
  db-host: "192.168.1.72"
  db-port: "5430"
  db-name: "stock-dumps"
  
  # API endpoints
  stock-svc-url: "https://api.example.com/stock"
  
  # Application configuration
  log-level: "INFO"
  batch-size: "50"
  max-concurrent-tasks: "10"
  
  # Market configuration
  trading-minutes-per-day: "375"
  market-start-time: "09:15:00"
  market-end-time: "15:30:00"
  
  # NSE API configuration
  nse-base-url: "https://www.nseindia.com"
  
  # Retry configuration
  max-retries: "10"
  retry-delay: "2"
  
  # Performance tuning
  connection-pool-size: "20"
  connection-pool-max-overflow: "30" 